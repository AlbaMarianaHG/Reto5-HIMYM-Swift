name: HIMYM iOS Build and Simulator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build, Test and Capture HIMYM Quiz
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        run: |
          xcodegen generate --spec project.yml
          ls -la HIMYMQuiz.xcodeproj

      - name: Build application
        run: |
          xcodebuild \
            -project HIMYMQuiz.xcodeproj \
            -scheme HIMYMQuiz \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          for devices in data["devices"].values():
              for device in devices:
                  if device.get("isAvailable", False) and "iPhone" in device["name"]:
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("No available iPhone simulator")
          ')

          echo "simulator_id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator: $SIMULATOR_ID"

      - name: Run UI tests for all five characters
        run: |
          xcodebuild test \
            -project HIMYMQuiz.xcodeproj \
            -scheme HIMYMQuiz \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.simulator_id }}" \
            -derivedDataPath build \
            -resultBundlePath build/HIMYMQuiz.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Export UI test screenshots
        if: always()
        run: |
          mkdir -p screenshots

          if [ -d build/HIMYMQuiz.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path build/HIMYMQuiz.xcresult \
              --output-path screenshots
          fi

      - name: Boot iPhone simulator
        if: always()
        run: |
          xcrun simctl boot \
            "${{ steps.simulator.outputs.simulator_id }}" || true

          xcrun simctl bootstatus \
            "${{ steps.simulator.outputs.simulator_id }}" -b

      - name: Install application
        if: success()
        run: |
          xcrun simctl install \
            "${{ steps.simulator.outputs.simulator_id }}" \
            build/Build/Products/Debug-iphonesimulator/HIMYMQuiz.app

      - name: Launch application
        if: success()
        run: |
          xcrun simctl launch \
            "${{ steps.simulator.outputs.simulator_id }}" \
            com.uveg.himym.quiz

          sleep 5

      - name: Capture welcome screen
        if: success()
        run: |
          mkdir -p screenshots

          xcrun simctl io \
            "${{ steps.simulator.outputs.simulator_id }}" \
            screenshot screenshots/01-welcome.png

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HIMYM-Screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: Upload application
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HIMYM-iOS-App
          path: build/Build/Products/Debug-iphonesimulator/HIMYMQuiz.app
